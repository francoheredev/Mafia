<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title data-i18n="mafia.player.pageTitle"></title>
<link rel="stylesheet" href="/platform/platform.css" />
<link rel="stylesheet" href="/games/mafia/mafia.css" />
</head>
<body class="player">
  <main class="join-screen">
    <div id="langSelector" class="lang-selector-slot"></div>
    <h1 data-i18n="mafia.title"></h1>

    <form id="joinForm">
      <label>
        <span data-i18n="mafia.player.roomCode"></span>
        <input id="codeInput" maxlength="4" placeholder="ABCD" autocapitalize="characters" required />
      </label>
      <label>
        <span data-i18n="mafia.player.yourName"></span>
        <input id="nameInput" maxlength="20" data-i18n-placeholder="mafia.player.yourName" required />
      </label>
      <button type="submit" data-i18n="mafia.player.join"></button>
    </form>

    <p id="errorMsg" class="error"></p>

    <div id="waitingRoom" class="hidden">
      <p id="youAreIn"></p>
      <p class="hint" data-i18n="mafia.player.waitingStart"></p>
    </div>
  </main>

  <!-- Fuera de <main> a propósito: así sobreviven a los reemplazos de
       #waitingRoom en cada fase y el rol queda siempre disponible. -->
  <button id="roleFab" class="role-fab hidden">🎭</button>
  <div id="roleModal" class="role-modal hidden">
    <div class="role-modal-panel">
      <button id="roleModalClose" class="role-modal-close">✕</button>
      <div id="roleModalContent"></div>
    </div>
  </div>

  <!-- El de reglas no es secreto (a diferencia del rol), así que arranca
       visible desde el lobby, no oculto hasta game:start. -->
  <button id="rulesFab" class="role-fab rules-fab-pos">📖</button>
  <div id="rulesModal" class="role-modal hidden">
    <div class="role-modal-panel">
      <button id="rulesModalClose" class="role-modal-close">✕</button>
      <div id="rulesModalContent"></div>
    </div>
  </div>

  <!-- Chat: general (todos) y fantasmas (solo jugadores ya eliminados,
       pestaña deshabilitada hasta que el propio jugador muera). -->
  <button id="chatFab" class="role-fab chat-fab-pos">💬</button>
  <div id="chatModal" class="role-modal hidden">
    <div class="role-modal-panel">
      <button id="chatModalClose" class="role-modal-close">✕</button>
      <div class="chat-tabs">
        <button type="button" id="chatTabGeneral" class="chat-tab active" data-channel="general" data-i18n="mafia.player.chatGeneral"></button>
        <button type="button" id="chatTabFantasmas" class="chat-tab" data-channel="fantasmas" disabled data-i18n="mafia.player.chatGhosts"></button>
      </div>
      <ul id="chatLog" class="chat-log"></ul>
      <form id="chatForm" class="chat-input-row">
        <input id="chatInput" maxlength="300" data-i18n-placeholder="mafia.player.chatPlaceholder" autocomplete="off" />
        <button type="submit" data-i18n="mafia.player.send"></button>
      </form>
    </div>
  </div>

  <!-- Historial público de la partida. -->
  <button id="historyFab" class="role-fab history-fab-pos">📜</button>
  <div id="historyModal" class="role-modal hidden">
    <div class="role-modal-panel">
      <button id="historyModalClose" class="role-modal-close">✕</button>
      <h2 data-i18n="platform.history.title"></h2>
      <ul id="historyList" class="history-list"></ul>
    </div>
  </div>

  <script src="/mafia/rules-data.js"></script>
  <script src="/platform/config.js"></script>
  <script src="/platform/i18n.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/platform/platform.js"></script>
  <script src="/platform/roster.js"></script>
  <script src="/platform/chat.js"></script>
  <script src="/platform/history.js"></script>
  <script src="/platform/rules.js"></script>
  <script src="/platform/connect.js"></script>
  <script src="/games/mafia/player.js"></script>
</body>
</html>
