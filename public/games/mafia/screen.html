<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title data-i18n="mafia.screen.pageTitle"></title>
<link rel="stylesheet" href="/platform/platform.css" />
<link rel="stylesheet" href="/games/mafia/mafia.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="screen">
  <main class="lobby-screen">
    <h1 data-i18n="mafia.title"></h1>
    <p class="subtitle" data-i18n="mafia.screen.scanToJoin"></p>

    <div class="code-panel">
      <div id="qrcode"></div>
      <div class="room-code" id="roomCode">----</div>
    </div>

    <section class="players-panel">
      <h2><span data-i18n="mafia.screen.playersInRoom"></span> (<span id="playerCount">0</span>)</h2>
      <ul id="playerList" class="player-list"></ul>
      <p class="hint" data-i18n="mafia.screen.minPlayers"></p>
      <button id="startBtn" disabled data-i18n="mafia.screen.start"></button>
      <p id="startError" class="error"></p>
    </section>
  </main>

  <!-- Fuera de .lobby-screen a propósito: renderScreen() la reemplaza
       entera en cada cambio de fase, y estos controles del host tienen
       que sobrevivir a eso. -->
  <button id="rulesFab" class="role-fab">📖</button>
  <div id="rulesModal" class="role-modal hidden">
    <div class="role-modal-panel">
      <button id="rulesModalClose" class="role-modal-close">✕</button>
      <div id="rulesModalContent"></div>
    </div>
  </div>

  <button id="soundFab" class="role-fab sound-fab-pos">🔊</button>

  <button id="historyFab" class="role-fab history-fab-pos">📜</button>
  <div id="historyModal" class="role-modal hidden">
    <div class="role-modal-panel">
      <button id="historyModalClose" class="role-modal-close">✕</button>
      <h2 data-i18n="platform.history.title"></h2>
      <ul id="historyList" class="history-list"></ul>
    </div>
  </div>

  <button id="hostFab" class="role-fab host-fab-pos">👥</button>
  <div id="hostModal" class="role-modal hidden">
    <div class="role-modal-panel">
      <button id="hostModalClose" class="role-modal-close">✕</button>
      <h2 data-i18n="mafia.screen.hostPlayers"></h2>
      <ul id="hostModalContent" class="host-roster"></ul>
    </div>
  </div>

  <script src="/mafia/rules-data.js"></script>
  <script src="/platform/config.js"></script>
  <script src="/platform/i18n.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/platform/platform.js"></script>
  <script src="/platform/roster.js"></script>
  <script src="/platform/chat.js"></script>
  <script src="/platform/history.js"></script>
  <script src="/platform/rules.js"></script>
  <script src="/platform/connect.js"></script>
  <script src="/games/mafia/screen.js"></script>
</body>
</html>
